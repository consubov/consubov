name: Cleanup consolidated branches

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.pull_request.number == 36 && github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove superseded branches
        shell: bash
        run: |
          for branch in \
            fix/fase3-audit-20261004 \
            fix/fase4-audit-20261005 \
            fix/pre-phase3-gates-20261003 \
            quality/fase5-web-gate-20261004 \
            quality/fase5-web-gate-main-20261004 \
            refactor/monorepo
          do
            git push origin --delete "$branch" || true
          done
