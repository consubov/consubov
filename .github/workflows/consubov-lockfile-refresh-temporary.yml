name: CONSUBOV - Temporary Web Lockfile Refresh
on:
  push:
    branches:
      - fix/consubov-web-deps-20261024

permissions:
  contents: write

concurrency:
  group: consubov-lock-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Bun 1.4.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Refresh bun.lock from constrained package declarations
        run: bun install --lockfile-only
      - name: Validate frozen install
        run: bun install --frozen-lockfile
      - name: Commit only refreshed lockfile to working branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json apps/web/package.json
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches. Nothing to update."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git commit -m 'chore(consubov): regenerate bun.lock for patched Web dependencies'
          git push origin HEAD:fix/consubov-web-deps-20261024
