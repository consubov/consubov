name: Temporary Dependency Refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  refresh:
    if: github.head_ref == 'fix/pre-phase3-gates-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Bun 1.4
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install frozen baseline
        run: bun install --frozen-lockfile

      - name: Prove baseline audit is red
        shell: bash
        run: |
          set +e
          bun audit --audit-level=high > baseline-audit.txt 2>&1
          STATUS=$?
          set -e
          cat baseline-audit.txt
          test "$STATUS" -ne 0

      - name: Apply candidate security versions
        shell: bash
        run: |
          bun - <<'EOF'
          import { readFile, writeFile } from "node:fs/promises";

          const root = JSON.parse(await readFile("package.json", "utf8"));
          root.packageManager = "bun@1.4.0";
          root.overrides = {
            "lodash@>=4.0.0 <=4.17.23": "4.18.0",
            "flatted@<3.4.2": "3.4.2",
            "js-yaml@>=4.0.0 <4.3.2": "4.3.2",
            "@remix-run/router@<=1.23.1": "1.23.2",
            "postcss@<=8.5.22": "8.5.23",
            "form-data@>=4.0.0 <4.0.6": "4.0.6",
            "nanoid@<3.3.18": "3.3.18",
            "glob@>=10.2.0 <10.5.0": "10.5.0",
            "ws@>=8.0.0 <8.21.0": "8.21.0",
            "browserslist@<=4.28.6": "4.28.7",
            "d3-color@>=1.0.2 <3.1.0": "3.1.0",
            "minimatch@<3.1.5": "3.1.5",
            "minimatch@>=9.0.0 <9.0.7": "9.0.7",
            "brace-expansion@<1.1.20": "1.1.20",
            "brace-expansion@>=2.0.0 <2.1.6": "2.1.6",
            "picomatch@<2.3.2": "2.3.2",
            "braces": "github:FSDevelop/braces#d0d575e55e74a4e0218e5248fafb79efc3e54ebb"
          };
          await writeFile("package.json", JSON.stringify(root, null, 2) + "\n");

          const web = JSON.parse(await readFile("apps/web/package.json", "utf8"));
          web.devDependencies.vite = "^6.4.3";
          web.devDependencies.vitest = "^5.0.3";
          await writeFile("apps/web/package.json", JSON.stringify(web, null, 2) + "\n");
          EOF
          bun install

      - name: Verify patched braces source is locked
        shell: bash
        run: grep -q 'FSDevelop-braces-d0d575e' bun.lock

      - name: Run dependency audit candidate
        shell: bash
        run: |
          set +e
          bun audit --audit-level=high | tee candidate-audit.txt
          AUDIT=${PIPESTATUS[0]}
          set -e
          echo "candidate_audit_exit=$AUDIT" >> "$GITHUB_ENV"
          exit 0

      - name: Run project check
        shell: bash
        run: |
          set +e
          bun run check > candidate-check.txt 2>&1
          CHECK=$?
          set -e
          cat candidate-check.txt
          echo "candidate_check_exit=$CHECK" >> "$GITHUB_ENV"
          exit 0

      - name: Test Supabase Edge Functions
        shell: bash
        run: |
          set +e
          (cd supabase/functions && bunx vitest@3.2.4 run) > candidate-edge.txt 2>&1
          EDGE=$?
          set -e
          cat candidate-edge.txt
          echo "candidate_edge_exit=$EDGE" >> "$GITHUB_ENV"
          exit 0

      - name: Package candidate
        shell: bash
        run: |
          mkdir -p dependency-refresh/apps/web dependency-refresh/apps/api
          cp package.json bun.lock dependency-refresh/
          cp apps/web/package.json dependency-refresh/apps/web/package.json
          cp apps/api/package.json dependency-refresh/apps/api/package.json
          cp baseline-audit.txt candidate-audit.txt candidate-check.txt candidate-edge.txt dependency-refresh/
          git diff -- package.json apps/web/package.json apps/api/package.json bun.lock > dependency-refresh/dependency-update.patch
          printf 'audit=%s\ncheck=%s\nedge=%s\n' "$candidate_audit_exit" "$candidate_check_exit" "$candidate_edge_exit" > dependency-refresh/status.txt

      - name: Upload dependency candidate
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-candidate
          path: dependency-refresh
          if-no-files-found: error
          retention-days: 1
