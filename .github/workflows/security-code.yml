name: Security Code Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scanning:
    runs-on: ubuntu-latest
    name: Secret Scanning
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run TruffleHog secret scanning
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          args: --only-verified --fail

  sast:
    runs-on: ubuntu-latest
    name: Static Application Security Testing
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint security scan (API)
        working-directory: apps/api
        run: bunx eslint . --max-warnings=0

      # O Web possui débito legado de lint geral e está congelado para edição.
      # Este gate executa somente as regras SAST de segurança já aprovadas, sem
      # esconder findings de segurança e sem transformar lint legado em falso bloqueio.
      - name: Run ESLint security scan (Web - security rules only)
        working-directory: apps/web
        run: >-
          bunx eslint src
          --no-config-lookup
          --ext .ts,.tsx
          --parser @typescript-eslint/parser
          --plugin security
          --rule 'security/detect-eval-with-expression:error'
          --rule 'security/detect-non-literal-fs-filename:error'
          --rule 'security/detect-possible-timing-attacks:error'

  dependency-vulnerability-scan:
    runs-on: ubuntu-latest
    name: Dependency Vulnerability Scan
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Política: vulnerabilidades high/critical quebram o gate (exit 1).
      # Observação: o comando `bun audit` existe na versão 1.3.12 usada aqui
      # (verificado localmente com `bun audit --help`). Não usar `npm audit`.
      - name: Run dependency vulnerability scan
        run: bun audit --audit-level=high
