name: CONSUBOV Zod Lock Refresh Temporary

on:
  push:
    branches:
      - fix/consubov-zod4-compat-20261024
    paths:
      - apps/web/package.json
      - apps/web/src/pages/LandingPage.tsx

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'consubov/consubov'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Bun 1.4.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Regenerate lockfile and verify frozen install
        run: |
          bun install
          bun install --frozen-lockfile
      - name: Commit generated lockfile on PR branch only
        shell: bash
        run: |
          set -euo pipefail
          git diff --stat -- bun.lock
          git add -- bun.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(consubov): refresh Bun lockfile for Zod 4"
            git push origin HEAD:refs/heads/fix/consubov-zod4-compat-20261024
          else
            echo "Lockfile already up-to-date"
          fi
