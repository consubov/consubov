name: F23 release isolation

on:
  pull_request:
    branches: [main]
    paths:
      - releases/**
      - scripts/deploy/release-gate.mjs
      - scripts/deploy/vercel-ignore.sh
      - scripts/tests/release-gate.test.mjs
      - .github/workflows/f23-release-isolation.yml
  push:
    branches: [main]
    paths:
      - releases/**
      - scripts/deploy/release-gate.mjs
      - scripts/deploy/vercel-ignore.sh
      - scripts/tests/release-gate.test.mjs
      - .github/workflows/f23-release-isolation.yml

permissions:
  contents: read

jobs:
  release-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Node version
        run: node --version
      - name: Test independent release gates
        run: node --test scripts/tests/release-gate.test.mjs
