name: CONSUBOV Legacy Upgrade QA Temporary
on:
  push:
    branches:
      - fix/consubov-pwa-resume-20261023

permissions:
  contents: read

jobs:
  legacy-inplace-qa:
    if: github.repository == 'consubov/consubov'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun 1.4.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Frozen install
        run: bun install --frozen-lockfile
      - name: Build installed PWA for legacy origin
        run: bun run --cwd apps/web build:legacy-upgrade
      - name: Check installed identity and App release surface
        run: |
          bun run --cwd apps/web check:legacy-upgrade-build
          node scripts/qa/check-pwa-build.mjs
      - name: Install browser engines
        run: bunx playwright install --with-deps chromium webkit
      - name: Same-origin offline upgrade fixtures
        working-directory: apps/web
        run: bunx playwright test --config=playwright.pwa.config.ts
