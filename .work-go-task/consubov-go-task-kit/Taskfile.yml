version: '3'

# Orquestrador local: nenhum comando aqui aciona o GitHub Actions remoto.
tasks:
  default:
    desc: Mostra as tarefas de QA disponiveis
    cmds:
      - task --list

  doctor:
    desc: Verifica as ferramentas locais sem iniciar CI remoto
    cmds:
      - bash scripts/qa/doctor.sh

  setup:
    desc: Instala dependencias do monorepo e navegadores Playwright
    cmds:
      - bun install --frozen-lockfile
      - cmd: bunx playwright install chromium webkit firefox
        dir: apps/web

  qa:phase5:
    desc: Gate local completo da FASE 5 com logs e resumo JSON
    cmds:
      - bash scripts/qa/record.sh phase5 bun run quality:phase5:local

  qa:pwa:smoke:
    desc: Regressao isolada de Service Worker (nao aprova FASE 6)
    cmds:
      - bash scripts/qa/record.sh pwa-smoke node --test apps/web/tests/sw-integrity.test.cjs apps/web/tests/sw-registration-integrity.test.cjs

  qa:phase6:
    desc: Gate local FASE 6; falha se o script completo ainda nao existir
    cmds:
      - bash scripts/qa/record.sh phase6 bash scripts/qa/run-package-script.sh quality:phase6:local

  qa:phase7:
    desc: Gate local FASE 7; falha se o script completo ainda nao existir
    cmds:
      - bash scripts/qa/record.sh phase7 bash scripts/qa/run-package-script.sh quality:phase7:local

  qa:all:
    desc: Gates FASE 5 depois FASE 6 depois FASE 7; falha no primeiro bloqueio
    cmds:
      - task qa:phase5
      - task qa:phase6
      - task qa:phase7

  qa:act:
    desc: Executa so o job build-and-test pelo act/Docker local (opcional)
    cmds:
      - bash scripts/qa/record.sh act bash scripts/qa/run-act.sh
