<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <!-- TODO: Set the document title to the name of your application -->
    <title>Consubov.app</title>
    <meta name="description" content="Sistema de Gestão Pecuária">
    <meta name="author" content="Lovable" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1B4332" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Consubov" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // Ajusta manifest/ícone/título por rota já na análise do HTML, para que o
      // navegador capture os metadados corretos ao "Adicionar à Tela de Início".
      (function () {
        try {
          var p = location.pathname.toLowerCase();
          var isStandalone = false;
          try {
            isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
          } catch (e) {}

          // Correção específica do Relatto: alguns webclips/PWAs reaproveitam o
          // start_url antigo da raiz mesmo após instalar pela rota /relatto. Se
          // o usuário instalou/visitou o Relatto e o app instalado abrir em "/",
          // redireciona antes do React renderizar a landing da Consubov.
          if ((p === '/' || p === '/index.html') && isStandalone) {
            var lastPwa = null;
            try { lastPwa = localStorage.getItem('relatto:pwa-profile'); } catch (e) {}
            if (lastPwa === 'relatto') {
              location.replace('/relatto');
              return;
            }
          }

          var m = null;
          if (p === '/relatto' || p.indexOf('/relatto/') === 0 || p.indexOf('/consultor') === 0) {
            m = { id: 'relatto', title: 'Relatto' };
          } else if (p.indexOf('/maisarrobas') === 0 || p.indexOf('/mais-arrobas') === 0 || p.indexOf('/pecuarista') === 0 || p.indexOf('/pesador') === 0) {
            m = { id: 'maisarrobas', title: 'Mais Arrobas' };
          } else if (p.indexOf('/syncvet') === 0) {
            m = { id: 'syncvet', title: 'SyncVet' };
          }
          if (!m) return;
          document.title = m.title;
          var man = document.querySelector('link[rel="manifest"]');
          if (man) man.setAttribute('href', '/manifest-' + m.id + '.json');
          var apple = document.querySelector('link[rel="apple-touch-icon"]');
          if (apple) apple.setAttribute('href', '/icon-' + m.id + '-192.png');
          var t = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (t) t.setAttribute('content', m.title);
          if (m.id === 'relatto') {
            try { localStorage.setItem('relatto:pwa-profile', 'relatto'); } catch (e) {}
          }
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="root"></div>
    <script>
      // Guardião de versão: roda antes do bundle. Se detectar um build publicado
      // diferente do último visto por este dispositivo, força unregister do SW,
      // limpa caches do app e recarrega. Resiliente a bundles antigos travados
      // (Android/iOS PWA presos em versões anteriores).
      (function () {
        try {
          var host = location.hostname;
          if (host.indexOf('id-preview--') !== -1 || host.indexOf('lovableproject.com') !== -1) return;
          var LS_KEY = 'consubov:last-seen-build';
          var GUARD_KEY = 'consubov:guard-reload';
          fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) {
              if (!data || !data.version) return;
              var remote = String(data.version);
              var stored = null;
              try { stored = localStorage.getItem(LS_KEY); } catch (e) {}
              if (stored === remote) return;
              // Primeira visita nesta versão — evita loop guardando marca antes.
              var guard = null;
              try { guard = sessionStorage.getItem(GUARD_KEY); } catch (e) {}
              try { localStorage.setItem(LS_KEY, remote); } catch (e) {}
              if (guard === remote) return; // já recarregou nesta sessão
              if (!stored) return; // primeira execução — só grava, não recarrega
              try { sessionStorage.setItem(GUARD_KEY, remote); } catch (e) {}
              var done = function () {
                var url = new URL(location.href);
                url.searchParams.set('__app_version', remote);
                url.searchParams.set('__v', Date.now().toString());
                location.replace(url.toString());
              };
              var unregSW = ('serviceWorker' in navigator)
                ? navigator.serviceWorker.getRegistrations().then(function (regs) {
                    return Promise.all(regs.map(function (r) { return r.unregister().catch(function () {}); }));
                  }).catch(function () {})
                : Promise.resolve();
              var clearCaches = ('caches' in window)
                ? caches.keys().then(function (keys) {
                    return Promise.all(keys.filter(function (k) { return k.indexOf('consubov-') === 0; })
                      .map(function (k) { return caches.delete(k).catch(function () {}); }));
                  }).catch(function () {})
                : Promise.resolve();
              Promise.all([unregSW, clearCaches]).then(done, done);
            })
            .catch(function () {});
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
