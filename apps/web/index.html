  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>Consubov | Gestão Pecuária</title>
    <meta name="description" content="Sistema de gestão pecuária Consubov.">
    <meta name="robots" content="index,follow">
    <meta name="author" content="Consubov" />
    <script>
      // Link correto ANTES da leitura do manifesto pelo navegador: /baixar da
      // nova origem deve instalar a PWA 2.0 com ID próprio, não o App anterior.
      (function () {
        var path = location.pathname.toLowerCase();
        var query = location.search.toLowerCase();
        var hostname = location.hostname.toLowerCase();
        var manifest = '/manifest.json';
        if (/(^|[.-])relatto([.-]|$)/.test(hostname) ||
            path === '/relatto' || path.indexOf('/relatto/') === 0 ||
            path.indexOf('/consultor') === 0 ||
            (path === '/baixar' && (query.indexOf('app=relatto') !== -1 || query.indexOf('pwa=relatto') !== -1))) {
          manifest = '/manifest-relatto.json';
        } else if (path.indexOf('/maisarrobas') === 0 ||
                   path.indexOf('/mais-arrobas') === 0 ||
                   path.indexOf('/pecuarista') === 0 ||
                   path.indexOf('/pesador') === 0) {
          manifest = '/manifest-maisarrobas.json';
        } else if (path.indexOf('/syncvet') === 0) {
          manifest = '/manifest-syncvet.json';
        } else if (hostname.startsWith('app.') ||
                   (/^consubov-[a-z0-9-]+\.vercel\.app$/.test(hostname) && query.indexOf('surface=app') !== -1)) {
          manifest = '/manifest-consubov-v2.json';
        }
        var link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifest;
        document.head.appendChild(link);
      })();
    </script>
    <meta name="theme-color" content="#1B4332" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Consubov" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // Ajusta manifest/ícone/título por rota já na análise do HTML, para que o
      // navegador capture os metadados corretos ao "Adicionar à Tela de Início".
      (function () {
        try {
          var p = location.pathname.toLowerCase();
          var isStandalone = false;
          try {
            isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
          } catch (e) {}

          // O convite vindo do legado deve mostrar a instalação CONSUBOV 2.0,
          // mesmo quando o navegador abre o endereço dentro de uma PWA instalada.
          var host = location.hostname.toLowerCase();
          var isV2Host = host === 'app.consubov.com.br' ||
            /^consubov-[a-z0-9-]+\.vercel\.app$/.test(host);
          var explicitRelatto = /(?:\?|&)(?:app|pwa)=relatto(?:&|$)/i.test(location.search);
          var isV2Download = p === '/baixar' && isV2Host && !explicitRelatto;

          // Ao abrir pelo ícone, a raiz continua indo para o sistema.
          // Apenas a entrada explícita /baixar da versão 2.0 permanece na instalação.
          if ((p === '/' || p === '/index.html' || (p === '/baixar' && !isV2Download)) && isStandalone) {
            var lastPwa = null;
            var hasRelattoCookie = false;
            try { lastPwa = localStorage.getItem('relatto:pwa-profile'); } catch (e) {}
            try { hasRelattoCookie = /(?:^|;\s*)relatto_pwa_profile=relatto(?:;|$)/.test(document.cookie || ''); } catch (e) {}
            if (lastPwa === 'relatto' || hasRelattoCookie || location.search.indexOf('pwa=relatto') !== -1 || location.search.indexOf('app=relatto') !== -1) {
              location.replace('/consultor');
              return;
            }
            location.replace('/app');
            return;
          }

          var m = null;
          if (p === '/relatto' || p.indexOf('/relatto/') === 0 || p.indexOf('/consultor') === 0 || (p === '/baixar' && location.search.toLowerCase().indexOf('app=relatto') !== -1)) {
            m = { id: 'relatto', title: 'Relatto' };
          } else if (p.indexOf('/maisarrobas') === 0 || p.indexOf('/mais-arrobas') === 0 || p.indexOf('/pecuarista') === 0 || p.indexOf('/pesador') === 0) {
            m = { id: 'maisarrobas', title: 'Mais Arrobas' };
          } else if (p.indexOf('/syncvet') === 0) {
            m = { id: 'syncvet', title: 'SyncVet' };
          }
          // Mantém o site institucional inalterado e identifica a PWA do novo domínio.
          if (!m && location.hostname.toLowerCase().startsWith('app.')) {
            document.title = 'Consubov 2.0 | Gestão Pecuária';
            var manifestV2 = document.querySelector('link[rel="manifest"]');
            if (manifestV2) manifestV2.setAttribute('href', '/manifest-consubov-v2.json');
            var appleTitleV2 = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appleTitleV2) appleTitleV2.setAttribute('content', 'Consubov 2.0');
            return;
          }
          if (!m) return;
          document.title = m.title;
          var man = document.querySelector('link[rel="manifest"]');
          if (man) man.setAttribute('href', '/manifest-' + m.id + '.json');
          var apple = document.querySelector('link[rel="apple-touch-icon"]');
          if (apple) apple.setAttribute('href', '/icon-' + m.id + '-192.png');
          var t = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (t) t.setAttribute('content', m.title);
          if (m.id === 'relatto') {
            try { localStorage.setItem('relatto:pwa-profile', 'relatto'); } catch (e) {}
            try { document.cookie = 'relatto_pwa_profile=relatto; Max-Age=31536000; Path=/; SameSite=Lax'; } catch (e) {}
          }
        } catch (e) {}
      })();
    </script>
