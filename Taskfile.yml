version: '3'

# Local QA. No remote GitHub Actions runners are called.
tasks:
  default:
    desc: List all CONSUBOV QA tasks
    cmds: [task --list]

  doctor:
    desc: Check Git Bash, Bun, Node and Go Task locally
    cmds: [bash scripts/qa/doctor.sh]

  setup:
    desc: Install dependencies and Playwright browsers locally
    cmds:
      - bun install --frozen-lockfile
      - cmd: bunx playwright install chromium webkit firefox
        dir: apps/web

  setup:codespace:
    desc: Provision tools and extensions only; no automatic tests, push or deploy
    cmds: [bash scripts/qa/setup-codespace.sh]

  qa:check:
    desc: Local check, build and unit tests with evidence
    cmds: [bash scripts/qa/record.sh check bun run check]

  qa:phase5:contracts:
    desc: Static E2E route/fixture contracts, not browser or phase acceptance
    cmds: [bash scripts/qa/record.sh phase5-contracts node --test apps/web/tests/phase5-e2e-contract.test.cjs apps/web/tests/phase5-fixture-data.test.cjs]

  qa:phase5:
    desc: Full FASE 5 local gate with evidence
    cmds:
      - task: qa:phase5:contracts
      - bash scripts/qa/record.sh phase5 bun run quality:phase5:local

  qa:pwa:smoke:
    desc: Isolated SW regression, not a FASE 6 approval
    cmds:
      - bash scripts/qa/record.sh pwa-smoke node --test apps/web/tests/sw-integrity.test.cjs apps/web/tests/sw-registration-integrity.test.cjs apps/web/tests/sw-build-injection.test.cjs

  qa:regressions:
    desc: Local standalone QA regressions (not phase approval)
    cmds:
      - bash scripts/qa/record.sh regressions node --test apps/web/tests/sw-integrity.test.cjs apps/web/tests/sw-registration-integrity.test.cjs apps/web/tests/sw-build-injection.test.cjs apps/web/tests/legacy-offline-inventory.test.cjs apps/web/tests/legacy-offline-safety.test.cjs apps/web/tests/indexeddb-local-adapter.test.cjs apps/web/tests/indexeddb-local-safety.test.cjs apps/web/tests/local-command-policy.test.cjs apps/web/tests/local-sync-round.test.cjs apps/web/tests/atomic-command-queue.test.cjs apps/web/tests/atomic-queue-transition-snapshot.test.cjs scripts/tests/lighthouse-budget.test.cjs scripts/tests/qa-matrix.test.cjs scripts/tests/pwa-build-integrity.test.cjs scripts/tests/preprod-local-gates.test.cjs scripts/tests/coverage-integrity.test.cjs scripts/tests/lint-changed-integrity.test.cjs scripts/tests/setup-guardrails.test.cjs scripts/tests/a11y-runner-integrity.test.cjs scripts/tests/phase5-local-targets.test.cjs scripts/tests/landing-icon-boundary.test.cjs scripts/tests/local-snapshot-rehearsal.test.mjs apps/web/tests/phase5-e2e-contract.test.cjs apps/web/tests/phase5-fixture-data.test.cjs

  qa:pwa:upgrade-fixture:
    desc: Synthetic local Chromium/WebKit same-origin update (not production legacy certification)
    cmds: [bash scripts/qa/record.sh pwa-upgrade-fixture bash scripts/qa/run-pwa-fixture.sh]

  qa:pwa:build-preflight:
    desc: Build Web locally and verify install identity, SW precache and every lazy chunk
    cmds:
      - bash scripts/qa/record.sh pwa-build bash -c 'bun run build:web && node scripts/qa/check-pwa-build.mjs'

  qa:offline:core:
    desc: Test scoped IndexedDB, durable atomic queue and offline sync coordinator with installed local fake-indexeddb
    cmds:
      - bash scripts/qa/record.sh offline-core node --test apps/web/tests/indexeddb-local-adapter.test.cjs apps/web/tests/indexeddb-local-safety.test.cjs apps/web/tests/local-command-policy.test.cjs apps/web/tests/local-sync-round.test.cjs apps/web/tests/atomic-command-queue.test.cjs apps/web/tests/atomic-queue-transition-snapshot.test.cjs

  qa:offline:browser:
    desc: Real browser IndexedDB multi-tab/offline command queue tests (Chromium/WebKit)
    cmds:
      - bash scripts/qa/record.sh offline-browser bash -c 'cd apps/web && bunx playwright test --config=playwright.pwa.config.ts queue-atomic.spec.ts'

  qa:preprod:rehearsal:
    desc: Local JSON fixture reconciliation and verified restore; not database or release approval
    cmds: [bash scripts/qa/record.sh local-rehearsal node --test scripts/tests/local-snapshot-rehearsal.test.mjs]

  qa:preprod:local-gates:
    desc: Fail-closed local QA evidence check; never authorizes deploy or real-world release
    cmds: [node scripts/qa/check-preprod-local-gates.mjs]

  qa:matrix:
    desc: Run all QA gates independently and report every failure without hiding aggregate FAIL
    cmds: [node scripts/qa/run-matrix.mjs]

  qa:phase6:
    desc: Full local FASE 6 gate; fails until implemented
    cmds: [bash scripts/qa/record.sh phase6 bash scripts/qa/run-package-script.sh quality:phase6:local]

  qa:offline:inventory:
    desc: Read-only Phase 7 legacy IndexedDB inventory tests (not OFFLINE READY)
    cmds: [bash scripts/qa/record.sh offline-inventory node --test apps/web/tests/legacy-offline-inventory.test.cjs apps/web/tests/legacy-offline-safety.test.cjs]

  qa:phase7:
    desc: Full local FASE 7 gate; fails until implemented
    cmds: [bash scripts/qa/record.sh phase7 bash scripts/qa/run-package-script.sh quality:phase7:local]

  qa:all:
    desc: Run FASE 5, FASE 6 then FASE 7 gates and stop on failure
    cmds:
      - task qa:phase5
      - task qa:phase6
      - task qa:phase7

  qa:act:
    desc: Optional Docker/act emulation of local build-and-test job
    cmds: [bash scripts/qa/record.sh act bash scripts/qa/run-act.sh]
